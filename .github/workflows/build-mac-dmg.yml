name: Build macOS .dmg (Signed + Notarized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          echo "$MAC_CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Set version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Rebuild speechmatics_engine from Python source on every build. Previously the
      # repo shipped a stale pre-built binary, so fixes to speechmatics_engine.py never
      # reached users. If this step fails the build fails loudly instead of silently
      # shipping the old engine.
      - name: Set up Python for engine build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build speechmatics_engine from source
        run: |
          brew install portaudio
          python3 -m venv "$RUNNER_TEMP/enginevenv"
          source "$RUNNER_TEMP/enginevenv/bin/activate"
          pip install --upgrade pip
          pip install pyinstaller speechmatics-python pyaudio numpy certifi
          pyinstaller speechmatics_engine.spec --distpath "$RUNNER_TEMP/enginedist" --workpath "$RUNNER_TEMP/enginebuild" -y
          chmod +x "$RUNNER_TEMP/enginedist/speechmatics_engine/speechmatics_engine"
          # ONEDIR build: dist/speechmatics_engine is a FOLDER (executable + hundreds of
          # dependency files under _internal/), not a single file — this removes the
          # multi-second self-extraction-to-temp delay onefile builds pay on EVERY app
          # launch (confirmed locally: onefile took 5-7s just to print its first line;
          # onedir prints it in ~0.1s). It is intentionally kept OUT of the Xcode-managed
          # source tree (see .gitignore) and injected directly into the exported .app
          # further down, after "Export signed .app" — Xcode's file-system-synchronized
          # Resources group copies nested folders file-by-file and collides on duplicate
          # basenames across multiple _internal/*.dist-info dirs (entry_points.txt,
          # top_level.txt, etc. repeat per package) if placed in the source tree instead.
          # Smoke test: binary must start and print its startup banner (no key → exit 1 is OK)
          "$RUNNER_TEMP/enginedist/speechmatics_engine/speechmatics_engine" 2>&1 | head -20 || true

      - name: Make bundled binaries executable
        run: |
          [ -f InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture ] && \
            chmod +x InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture || true

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>687K9LK6N4</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        run: |
          xcodebuild archive \
            -project InterviewCopilot/InterviewCopilot.xcodeproj \
            -scheme InterviewCopilot \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=687K9LK6N4 \
            ENABLE_APP_SANDBOX=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

      - name: Export signed .app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Inject speechmatics_engine into the exported app
        run: |
          # Copied here (post-export) rather than into the source tree pre-archive, so
          # Xcode's Resources build phase never touches this folder — see the comment in
          # "Build speechmatics_engine from source" for why that flattens/collides.
          APP="$RUNNER_TEMP/export/InterviewCopilot.app"
          rm -rf "$APP/Contents/Resources/speechmatics_engine"
          cp -R "$RUNNER_TEMP/enginedist/speechmatics_engine" "$APP/Contents/Resources/speechmatics_engine"
          chmod +x "$APP/Contents/Resources/speechmatics_engine/speechmatics_engine"
          echo "Engine injected: $(du -sh "$APP/Contents/Resources/speechmatics_engine" | cut -f1)"

      - name: Re-sign bundled helper binaries with Hardened Runtime
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          APP="$RUNNER_TEMP/export/InterviewCopilot.app"
          # Write entitlements for PyInstaller-based speechmatics_engine
          # (needs unsigned-memory + library-validation bypass for embedded Python runtime)
          cat > "$RUNNER_TEMP/helper.entitlements" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          EOF
          # Sign helper binaries with the SAME identifier as the main app so macOS treats
          # them as the same TCC principal. Without --identifier they get their own identity
          # ("speechmatics_engine") and macOS feeds them silence even when the app has mic.
          for BIN in speechmatics_engine SystemAudioCapture; do
            BIN_PATH="$APP/Contents/Resources/$BIN"
            if [ -d "$BIN_PATH" ]; then
              # ONEDIR folder: sign every Mach-O inside (main executable + bundled
              # dylibs/so files) so the whole tree passes `codesign --verify --deep
              # --strict` later. Signing order among these doesn't matter.
              find "$BIN_PATH" -type f \( -name "*.dylib" -o -name "*.so" -o -perm -u+x \) -print0 \
                | while IFS= read -r -d '' F; do
                    codesign --force --options runtime \
                      --entitlements "$RUNNER_TEMP/helper.entitlements" \
                      --sign "$IDENTITY" \
                      --identifier "com.bindualekhya.InterviewCopilot" \
                      --keychain "$RUNNER_TEMP/build.keychain" \
                      "$F" 2>/dev/null || true
                  done
              echo "Signed folder: $BIN"
            elif [ -f "$BIN_PATH" ]; then
              codesign --force --options runtime \
                --entitlements "$RUNNER_TEMP/helper.entitlements" \
                --sign "$IDENTITY" \
                --identifier "com.bindualekhya.InterviewCopilot" \
                --keychain "$RUNNER_TEMP/build.keychain" \
                "$BIN_PATH"
              echo "Signed: $BIN ($(codesign -dv "$BIN_PATH" 2>&1 | grep Identifier || echo 'ok'))"
            fi
          done
          # Inject the Google OAuth client secret (from the GOOGLE_CLIENT_SECRET repo
          # secret) into the app's Info.plist so "Continue with Google" can complete the
          # token exchange. Done BEFORE the re-seal so the signature covers it. Entirely
          # optional: if the secret isn't configured, Google stays disabled and
          # email/password sign-in is unaffected.
          if [ -n "${GOOGLE_CLIENT_SECRET}" ]; then
            /usr/libexec/PlistBuddy -c "Add :GoogleClientSecret string ${GOOGLE_CLIENT_SECRET}" "$APP/Contents/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :GoogleClientSecret ${GOOGLE_CLIENT_SECRET}" "$APP/Contents/Info.plist"
            echo "GoogleClientSecret injected into Info.plist"
          else
            echo "GOOGLE_CLIENT_SECRET not set — Google sign-in stays disabled (email/password works)"
          fi

          # Re-seal the whole .app after modifying internals.
          # MUST pass --entitlements explicitly: without it codesign may strip the
          # audio-input and camera entitlements that Xcode embedded, causing macOS
          # to return AVAuthorizationStatus.denied (.denied) for mic on every install.
          codesign --force --options runtime \
            --entitlements "InterviewCopilot/InterviewCopilot/InterviewCopilot.entitlements" \
            --sign "$IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create .dmg
        run: |
          DMG_CONTENT=$(mktemp -d)
          cp -R "$RUNNER_TEMP/export/InterviewCopilot.app" "$DMG_CONTENT/"
          ln -s /Applications "$DMG_CONTENT/Applications"
          hdiutil create \
            -volname "Interview Copilot" \
            -srcfolder "$DMG_CONTENT" \
            -ov -format UDBZ \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          codesign --force --sign "$IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain" \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          cp "$RUNNER_TEMP/InterviewCopilot-raw.dmg" "InterviewCopilot-mac.dmg"
          echo "DMG size: $(du -sh InterviewCopilot-mac.dmg | cut -f1)"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit and grab the submission ID immediately (no --wait, avoids infinite hang)
          SUBMIT=$(xcrun notarytool submit "InterviewCopilot-mac.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          echo "$SUBMIT"
          SUB_ID=$(echo "$SUBMIT" | grep -E "^\s+id: " | head -1 | awk '{print $2}')
          echo "Submission ID: $SUB_ID"
          [ -z "$SUB_ID" ] && { echo "Failed to get submission ID"; exit 1; }

          # Poll for up to 15 minutes (30 x 30s)
          for i in $(seq 1 30); do
            sleep 30
            INFO=$(xcrun notarytool info "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1)
            echo "[$i/30] $INFO"
            STATUS=$(echo "$INFO" | grep -E "^\s+status: " | awk '{print $2}')
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization accepted!"
              exit 0
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization FAILED — fetching Apple log:"
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
          done
          echo "Timed out after 15 min — fetching partial log:"
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          exit 1

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "InterviewCopilot-mac.dmg"
          xcrun stapler validate "InterviewCopilot-mac.dmg"
          echo "Notarization stapled OK"

      - name: Create update .zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/InterviewCopilot.app" \
            "InterviewCopilot-update.zip"
          echo "Update zip size: $(du -sh InterviewCopilot-update.zip | cut -f1)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Interview Copilot v${{ steps.version.outputs.VERSION }}
          body: |
            ## Install on macOS
            **First time?** Download **InterviewCopilot-mac.dmg** → drag to Applications.
            **Already installed?** The app checks for updates automatically (once a day, or any time from Settings → Check for Updates) and installs them via Sparkle.

            Signed and notarized by Apple. No security warnings on install.
          files: |
            InterviewCopilot-mac.dmg
            InterviewCopilot-update.zip
          draft: false
          prerelease: false

      # Real auto-update: regenerate appcast.xml (the feed Sparkle polls, see SUFeedURL in
      # Info.plist) with this release's signed entry, then publish it to main so
      # raw.githubusercontent.com/.../appcast.xml — what every installed copy is already
      # polling — picks it up. Requires the SPARKLE_PRIVATE_KEY repo secret (paste the key
      # from `generate_keys -x` there); until that secret exists this step no-ops and
      # existing installs simply keep finding nothing new, same as today.
      - name: Update Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            # This used to exit 0. The result was a green release that no installed copy
            # could ever receive: binaries published, feed untouched, nothing to tell
            # anyone an update existed. A release users cannot get is not a release, and
            # a green check over it is worse than a red one, because nobody goes looking.
            echo "::error::SPARKLE_PRIVATE_KEY is not set. The build is signed and uploaded, but"
            echo "::error::the appcast was NOT regenerated, so no installed copy will ever see"
            echo "::error::this version. Add the secret and re-run before calling this released."
            exit 1
          fi
          curl -sL -o "$RUNNER_TEMP/sparkle-tools.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xf "$RUNNER_TEMP/sparkle-tools.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"
          chmod +x "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast"

          APPCAST_DIR="$RUNNER_TEMP/appcast_dir"
          mkdir -p "$APPCAST_DIR"
          cp InterviewCopilot-update.zip "$APPCAST_DIR/"
          # Reuse the existing appcast if one is already published, so old entries aren't lost.
          # Seed from THIS repo's own feed, not a hardcoded one. The account moved once
          # already and these two URLs did not move with it, which is how every published
          # download URL ended up pointing at a repo the project no longer releases from.
          curl -sL -o "$APPCAST_DIR/appcast.xml" "https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml" || true
          grep -q "<rss" "$APPCAST_DIR/appcast.xml" 2>/dev/null || rm -f "$APPCAST_DIR/appcast.xml"

          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/" \
            "$APPCAST_DIR"

          cp "$APPCAST_DIR/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
          else
            git commit -m "Update appcast for v${{ steps.version.outputs.VERSION }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
