name: Build macOS .dmg (Signed + Notarized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Round app icon corners (macOS standard)
        run: |
          python3 -m venv /tmp/icon-venv
          source /tmp/icon-venv/bin/activate
          pip install Pillow --quiet
          python3 round_icon.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          echo "$MAC_CERT_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Set version number
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Update Info.plist version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION }}" \
            InterviewCopilotMac6/Assets/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            InterviewCopilotMac6/Assets/Info.plist
          echo "Info.plist updated to ${{ steps.version.outputs.VERSION }}"

      - name: Restore dependencies
        run: dotnet restore InterviewCopilotMac6/InterviewCopilotMac6.csproj

      - name: Publish (ARM64 self-contained)
        run: |
          dotnet publish InterviewCopilotMac6/InterviewCopilotMac6.csproj \
            -r osx-arm64 \
            --self-contained true \
            -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o publish/arm64

      - name: Build speechmatics_engine binary (bundles Python + pyaudio + deps)
        run: |
          brew install portaudio python@3.11
          python3.11 -m venv /tmp/build-venv
          source /tmp/build-venv/bin/activate
          pip install pyaudio numpy speechmatics-python pyinstaller
          cd InterviewCopilotMac6
          pyinstaller --onefile --name speechmatics_engine speechmatics_engine.py
          echo "Engine binary size: $(du -sh dist/speechmatics_engine | cut -f1)"

      - name: Assemble .app bundle
        run: |
          APP="InterviewCopilot.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp InterviewCopilotMac6/Assets/Info.plist "$APP/Contents/Info.plist"
          mkdir -p AppIcon.iconset
          source /tmp/icon-venv/bin/activate
          python3 - << 'PYEOF'
from PIL import Image
sizes = {
    "icon_16x16.png": 16, "icon_16x16@2x.png": 32,
    "icon_32x32.png": 32, "icon_32x32@2x.png": 64,
    "icon_128x128.png": 128, "icon_128x128@2x.png": 256,
    "icon_256x256.png": 256, "icon_256x256@2x.png": 512,
    "icon_512x512.png": 512, "icon_512x512@2x.png": 1024,
}
img = Image.open("InterviewCopilotMac6/Assets/AppIcon.png").convert("RGBA")
for name, size in sizes.items():
    img.resize((size, size), Image.LANCZOS).save(f"AppIcon.iconset/{name}", "PNG")
    print(f"  {name}: {size}x{size}")
PYEOF
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp publish/arm64/* "$APP/Contents/MacOS/" 2>/dev/null || true
          # Copy bundled engine binary (includes Python + pyaudio + all deps)
          cp InterviewCopilotMac6/dist/speechmatics_engine "$APP/Contents/MacOS/speechmatics_engine"
          chmod +x "$APP/Contents/MacOS/speechmatics_engine"
          echo "Engine binary copied: $(du -sh "$APP/Contents/MacOS/speechmatics_engine" | cut -f1)"
          if [ -f "$APP/Contents/MacOS/InterviewCopilotMac6" ]; then
            mv "$APP/Contents/MacOS/InterviewCopilotMac6" "$APP/Contents/MacOS/InterviewCopilot"
          fi
          chmod +x "$APP/Contents/MacOS/InterviewCopilot"
          [ -f "$APP/Contents/MacOS/ScreenOCR" ]          && chmod +x "$APP/Contents/MacOS/ScreenOCR"
          [ -f "$APP/Contents/MacOS/SystemAudioCapture" ] && chmod +x "$APP/Contents/MacOS/SystemAudioCapture"
          chmod +x "$APP/Contents/MacOS/"*.dylib 2>/dev/null || true

      - name: Create entitlements.plist
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.device.audio-input</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Sign .app
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          echo "Signing with: $IDENTITY"
          find InterviewCopilot.app/Contents/MacOS -name "*.pdb" -delete
          find InterviewCopilot.app/Contents/MacOS -name "*.xml" -delete
          find InterviewCopilot.app/Contents/MacOS -name "*.py" -exec mv {} InterviewCopilot.app/Contents/Resources/ \;
          find InterviewCopilot.app/Contents/MacOS -name "*.sh" -exec mv {} InterviewCopilot.app/Contents/Resources/ \;
          find InterviewCopilot.app/Contents/MacOS -name "*.json" -exec mv {} InterviewCopilot.app/Contents/Resources/ \;
          find InterviewCopilot.app/Contents/MacOS -name "*.dylib" | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" "$f"
          done
          find InterviewCopilot.app/Contents/MacOS -name "*.dll" | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" "$f" 2>/dev/null || true
          done
          find InterviewCopilot.app/Contents/MacOS -type f ! -name "*.dylib" ! -name "*.dll" ! -name "*.py" ! -name "*.sh" ! -name "*.json" ! -name "*.xml" ! -name "*.pdb" | while read f; do
            codesign --force --options runtime --entitlements entitlements.plist --sign "$IDENTITY" "$f" 2>/dev/null || true
          done
          codesign --force --options runtime \
            --entitlements entitlements.plist \
            --sign "$IDENTITY" \
            "InterviewCopilot.app"
          codesign --verify --verbose=2 "InterviewCopilot.app"
          spctl --assess --verbose=2 "InterviewCopilot.app" || true

      - name: Create .zip for auto-updates (NetSparkle)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "InterviewCopilot.app" "InterviewCopilot-update.zip"
          echo "Update zip size: $(du -sh InterviewCopilot-update.zip | cut -f1)"

      - name: Create .dmg for first-time installs
        run: |
          mkdir -p dmg_contents
          cp -R "InterviewCopilot.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create \
            -volname "Interview Copilot" \
            -srcfolder dmg_contents \
            -ov -format UDBZ \
            "InterviewCopilot-raw.dmg"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          codesign --force --sign "$IDENTITY" "InterviewCopilot-raw.dmg"
          mv "InterviewCopilot-raw.dmg" "InterviewCopilot-mac.dmg"
          echo "DMG size: $(du -sh InterviewCopilot-mac.dmg | cut -f1)"

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 120
        run: |
          xcrun notarytool submit "InterviewCopilot-mac.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Notarization accepted!"

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "InterviewCopilot-mac.dmg"
          xcrun stapler validate "InterviewCopilot-mac.dmg"
          echo "Notarization stapled OK"

      - name: Sign update .zip and generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          export DOWNLOAD_URL="https://github.com/moto123a/interview-copilot-mac/releases/download/v${VERSION}/InterviewCopilot-update.zip"
          export FILE_SIZE=$(stat -f%z "InterviewCopilot-update.zip")
          export PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          python3 -m venv /tmp/sign-venv
          source /tmp/sign-venv/bin/activate
          pip install cryptography --quiet
          python3 sign_sparkle.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Interview Copilot v${{ steps.version.outputs.VERSION }}
          body: |
            ## Install on macOS ✓
            **First time?** Download **InterviewCopilot-mac.dmg** → drag to Applications.
            **Already installed?** The app will notify you automatically — just click "Update Now".

            Signed and notarized by Apple. No security prompts.
          files: |
            InterviewCopilot-mac.dmg
            InterviewCopilot-update.zip
          draft: false
          prerelease: false

      - name: Commit appcast.xml back to repo
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add appcast.xml
          git diff --staged --quiet || \
            git commit -m "chore: update appcast to v${{ steps.version.outputs.VERSION }} [skip ci]"
          git push
