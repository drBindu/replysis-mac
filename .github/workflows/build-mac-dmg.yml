name: Build macOS .dmg (Signed + Notarized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          echo "$MAC_CERT_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Restore dependencies
        run: dotnet restore InterviewCopilotMac6/InterviewCopilotMac6.csproj

      - name: Publish (ARM64 self-contained)
        run: |
          dotnet publish InterviewCopilotMac6/InterviewCopilotMac6.csproj \
            -r osx-arm64 \
            --self-contained true \
            -c Release \
            -o publish/arm64

      - name: Assemble .app bundle
        run: |
          APP="InterviewCopilot.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp InterviewCopilotMac6/Assets/Info.plist "$APP/Contents/Info.plist"
          mkdir -p AppIcon.iconset
          sips -z 16   16   InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32   32   InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64   64   InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256  256  InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512  512  InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512  512  InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 InterviewCopilotMac6/Assets/AppIcon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp publish/arm64/* "$APP/Contents/MacOS/" 2>/dev/null || true
          if [ -f "$APP/Contents/MacOS/InterviewCopilotMac6" ]; then
            mv "$APP/Contents/MacOS/InterviewCopilotMac6" "$APP/Contents/MacOS/InterviewCopilot"
          fi
          chmod +x "$APP/Contents/MacOS/InterviewCopilot"
          [ -f "$APP/Contents/MacOS/ScreenOCR" ]          && chmod +x "$APP/Contents/MacOS/ScreenOCR"
          [ -f "$APP/Contents/MacOS/SystemAudioCapture" ] && chmod +x "$APP/Contents/MacOS/SystemAudioCapture"
          chmod +x "$APP/Contents/MacOS/"*.dylib 2>/dev/null || true

      - name: Create entitlements.plist
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.device.audio-input</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
