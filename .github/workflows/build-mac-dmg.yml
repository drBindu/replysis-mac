name: Build macOS .dmg (Signed + Notarized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          echo "$MAC_CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Set version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Make bundled binaries executable
        run: |
          [ -f InterviewCopilot/InterviewCopilot/Resources/speechmatics_engine ] && \
            chmod +x InterviewCopilot/InterviewCopilot/Resources/speechmatics_engine || true
          [ -f InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture ] && \
            chmod +x InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture || true

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>687K9LK6N4</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        run: |
          xcodebuild archive \
            -project InterviewCopilot/InterviewCopilot.xcodeproj \
            -scheme InterviewCopilot \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=687K9LK6N4 \
            ENABLE_APP_SANDBOX=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

      - name: Export signed .app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Re-sign bundled helper binaries with Hardened Runtime
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          APP="$RUNNER_TEMP/export/InterviewCopilot.app"
          # Write entitlements for PyInstaller-based speechmatics_engine
          # (needs unsigned-memory + library-validation bypass for embedded Python runtime)
          cat > "$RUNNER_TEMP/helper.entitlements" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          EOF
          # Sign helper binaries — Xcode copies them as Resources but doesn't re-sign them
          for BIN in speechmatics_engine SystemAudioCapture; do
            BIN_PATH="$APP/Contents/Resources/$BIN"
            [ -f "$BIN_PATH" ] || continue
            codesign --force --options runtime \
              --entitlements "$RUNNER_TEMP/helper.entitlements" \
              --sign "$IDENTITY" \
              --keychain "$RUNNER_TEMP/build.keychain" \
              "$BIN_PATH"
            echo "Signed: $BIN ($(codesign -dv "$BIN_PATH" 2>&1 | grep Identifier || echo 'ok'))"
          done
          # Inject the Google OAuth client secret (from the GOOGLE_CLIENT_SECRET repo
          # secret) into the app's Info.plist so "Continue with Google" can complete the
          # token exchange. Done BEFORE the re-seal so the signature covers it. Entirely
          # optional: if the secret isn't configured, Google stays disabled and
          # email/password sign-in is unaffected.
          if [ -n "${GOOGLE_CLIENT_SECRET}" ]; then
            /usr/libexec/PlistBuddy -c "Add :GoogleClientSecret string ${GOOGLE_CLIENT_SECRET}" "$APP/Contents/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :GoogleClientSecret ${GOOGLE_CLIENT_SECRET}" "$APP/Contents/Info.plist"
            echo "GoogleClientSecret injected into Info.plist"
          else
            echo "GOOGLE_CLIENT_SECRET not set — Google sign-in stays disabled (email/password works)"
          fi

          # Re-seal the whole .app after modifying internals
          codesign --force --options runtime \
            --sign "$IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create .dmg
        run: |
          DMG_CONTENT=$(mktemp -d)
          cp -R "$RUNNER_TEMP/export/InterviewCopilot.app" "$DMG_CONTENT/"
          ln -s /Applications "$DMG_CONTENT/Applications"
          hdiutil create \
            -volname "Interview Copilot" \
            -srcfolder "$DMG_CONTENT" \
            -ov -format UDBZ \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          codesign --force --sign "$IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain" \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          cp "$RUNNER_TEMP/InterviewCopilot-raw.dmg" "InterviewCopilot-mac.dmg"
          echo "DMG size: $(du -sh InterviewCopilot-mac.dmg | cut -f1)"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit and grab the submission ID immediately (no --wait, avoids infinite hang)
          SUBMIT=$(xcrun notarytool submit "InterviewCopilot-mac.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          echo "$SUBMIT"
          SUB_ID=$(echo "$SUBMIT" | grep -E "^\s+id: " | head -1 | awk '{print $2}')
          echo "Submission ID: $SUB_ID"
          [ -z "$SUB_ID" ] && { echo "Failed to get submission ID"; exit 1; }

          # Poll for up to 15 minutes (30 x 30s)
          for i in $(seq 1 30); do
            sleep 30
            INFO=$(xcrun notarytool info "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1)
            echo "[$i/30] $INFO"
            STATUS=$(echo "$INFO" | grep -E "^\s+status: " | awk '{print $2}')
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization accepted!"
              exit 0
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization FAILED — fetching Apple log:"
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
          done
          echo "Timed out after 15 min — fetching partial log:"
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          exit 1

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "InterviewCopilot-mac.dmg"
          xcrun stapler validate "InterviewCopilot-mac.dmg"
          echo "Notarization stapled OK"

      - name: Create update .zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/InterviewCopilot.app" \
            "InterviewCopilot-update.zip"
          echo "Update zip size: $(du -sh InterviewCopilot-update.zip | cut -f1)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Interview Copilot v${{ steps.version.outputs.VERSION }}
          body: |
            ## Install on macOS
            **First time?** Download **InterviewCopilot-mac.dmg** → drag to Applications.
            **Already installed?** The app updates automatically.

            Signed and notarized by Apple. No security warnings on install.
          files: |
            InterviewCopilot-mac.dmg
            InterviewCopilot-update.zip
          draft: false
          prerelease: false
