name: Build macOS .dmg (Signed + Notarized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          echo "$MAC_CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Set version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Make bundled binaries executable
        run: |
          [ -f InterviewCopilot/InterviewCopilot/Resources/speechmatics_engine ] && \
            chmod +x InterviewCopilot/InterviewCopilot/Resources/speechmatics_engine || true
          [ -f InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture ] && \
            chmod +x InterviewCopilot/InterviewCopilot/Resources/SystemAudioCapture || true

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>687K9LK6N4</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        run: |
          xcodebuild archive \
            -project InterviewCopilot/InterviewCopilot.xcodeproj \
            -scheme InterviewCopilot \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=687K9LK6N4 \
            ENABLE_APP_SANDBOX=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

      - name: Export signed .app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/InterviewCopilot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Create .dmg
        run: |
          DMG_CONTENT=$(mktemp -d)
          cp -R "$RUNNER_TEMP/export/InterviewCopilot.app" "$DMG_CONTENT/"
          ln -s /Applications "$DMG_CONTENT/Applications"
          hdiutil create \
            -volname "Interview Copilot" \
            -srcfolder "$DMG_CONTENT" \
            -ov -format UDBZ \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          codesign --force --sign "$IDENTITY" \
            --keychain "$RUNNER_TEMP/build.keychain" \
            "$RUNNER_TEMP/InterviewCopilot-raw.dmg"
          cp "$RUNNER_TEMP/InterviewCopilot-raw.dmg" "InterviewCopilot-mac.dmg"
          echo "DMG size: $(du -sh InterviewCopilot-mac.dmg | cut -f1)"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 30
        run: |
          xcrun notarytool submit "InterviewCopilot-mac.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "InterviewCopilot-mac.dmg"
          xcrun stapler validate "InterviewCopilot-mac.dmg"
          echo "Notarization stapled OK"

      - name: Create update .zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/InterviewCopilot.app" \
            "InterviewCopilot-update.zip"
          echo "Update zip size: $(du -sh InterviewCopilot-update.zip | cut -f1)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Interview Copilot v${{ steps.version.outputs.VERSION }}
          body: |
            ## Install on macOS
            **First time?** Download **InterviewCopilot-mac.dmg** → drag to Applications.
            **Already installed?** The app updates automatically.

            Signed and notarized by Apple. No security warnings on install.
          files: |
            InterviewCopilot-mac.dmg
            InterviewCopilot-update.zip
          draft: false
          prerelease: false
