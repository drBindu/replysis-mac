name: Build macOS .pkg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore InterviewCopilotMac6/InterviewCopilotMac6.csproj

      - name: Publish (ARM64 self-contained)
        run: |
          dotnet publish InterviewCopilotMac6/InterviewCopilotMac6.csproj \
            -r osx-arm64 \
            --self-contained true \
            -c Release \
            -o publish/arm64

      - name: Assemble .app bundle
        run: |
          APP="InterviewCopilot.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # Info.plist
          cp InterviewCopilotMac6/Assets/Info.plist "$APP/Contents/Info.plist"

          # All published files (binary, dylibs, helpers, py script)
          cp publish/arm64/* "$APP/Contents/MacOS/" 2>/dev/null || true

          # Rename main binary to match CFBundleExecutable = "InterviewCopilot"
          if [ -f "$APP/Contents/MacOS/InterviewCopilotMac6" ]; then
            mv "$APP/Contents/MacOS/InterviewCopilotMac6" "$APP/Contents/MacOS/InterviewCopilot"
          fi

          # Set executable permissions
          chmod +x "$APP/Contents/MacOS/InterviewCopilot"
          [ -f "$APP/Contents/MacOS/ScreenOCR" ]           && chmod +x "$APP/Contents/MacOS/ScreenOCR"
          [ -f "$APP/Contents/MacOS/SystemAudioCapture" ]  && chmod +x "$APP/Contents/MacOS/SystemAudioCapture"
          chmod +x "$APP/Contents/MacOS/"*.dylib 2>/dev/null || true

          echo "App bundle contents:"
          ls -lh "$APP/Contents/MacOS/"

      - name: Create .pkg installer
        run: |
          pkgbuild \
            --component "InterviewCopilot.app" \
            --install-location /Applications \
            "InterviewCopilot-mac.pkg"

          echo "PKG size: $(du -sh InterviewCopilot-mac.pkg | cut -f1)"

      - name: Upload .pkg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Interview Copilot v1.0.${{ github.run_number }}
          body: |
            ## Install
            1. Download **InterviewCopilot-mac.pkg**
            2. Double-click to install
            3. Open **Interview Copilot** from your Applications folder
          files: InterviewCopilot-mac.pkg
          draft: false
          prerelease: false
